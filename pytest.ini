[pytest]
# Run from the repo root: `python -m pytest`
# pythonpath puts the repo root on sys.path so `import backend.*` works without
# backend/ being an installed package.
# https://docs.pytest.org/en/stable/reference/reference.html#confval-pythonpath (pytest >= 7)
testpaths = backend/tests
pythonpath = .

# Slow tests touch real (cached) datasets. Skipped by default; run them with
#   python -m pytest -m slow
markers =
    slow: integration tests on real cached datasets (minutes, not seconds)
addopts = -m "not slow"
